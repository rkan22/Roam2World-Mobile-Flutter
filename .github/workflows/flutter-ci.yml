name: Flutter CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

env:
  PRODUCTION_API_BASE_URL: https://api.roam2world.com

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Parse Dart sources
        run: dart format --output=none lib test

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.roam2world.b2b"' android/app/build.gradle.kts
          grep -F 'namespace = "com.roam2world.b2b"' android/app/build.gradle.kts
          grep -F 'android:label="Roam2World B2B"' android/app/src/main/AndroidManifest.xml
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER=com.roam2world.b2b' ios/Flutter/Release.xcconfig
          grep -F '<string>Roam2World B2B</string>' ios/Runner/Info.plist
          grep -F "static const String appName = 'Roam2World B2B';" lib/core/config/app_environment.dart

      - name: Validate production API URL
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCTION_API_BASE_URL" in
            https://*) ;;
            *) echo "Production API must use HTTPS" >&2; exit 1 ;;
          esac
          if [[ "$PRODUCTION_API_BASE_URL" =~ (localhost|127\.0\.0\.1|10\.0\.2\.2|\.local)(:|/|$) ]]; then
            echo "Production API cannot target a local host" >&2
            exit 1
          fi

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"

      - name: Build Android debug APK with production config
        run: flutter build apk --debug --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"
