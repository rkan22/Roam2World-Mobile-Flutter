name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_API_BASE_URL: https://roam2world-panels-backend.onrender.com

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Parse Dart sources
        run: dart format --output=none lib test

      - name: Validate release scripts
        run: |
          bash -n tool/validate_release_config.sh
          bash -n tool/build_android_release.sh
          bash -n tool/smoke_test_production.sh

      - name: Validate release configuration
        run: bash tool/validate_release_config.sh

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"

      - name: Build Android debug APK with production config
        run: flutter build apk --debug --dart-define=API_BASE_URL="$PRODUCTION_API_BASE_URL"
