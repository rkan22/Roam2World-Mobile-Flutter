name: roam2world_mobile_flutter
description: "Roam2World B2B mobile application for reseller and dealer operations."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.3.1
  url_launcher: ^6.3.2
  zxing_lib: ^1.1.4
  flutter_staggered_grid_view: ^0.7.0
  permission_handler: ^12.0.3
  file_picker: ^10.3.10
  desktop_drop: ^0.7.1
  mobile_scanner: ^7.4.0
  webview_flutter: ^4.14.1
  device_info_plus: ^12.4.0
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2
  app_links: ^7.2.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^20.1.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.2.0
  package_info_plus: ^9.0.1
  google_fonts: ^8.2.1
  pointycastle: ^4.0.0
  dlibphonenumber: ^1.1.69
  ble:
    path: vendor/NekokoLPA2/local_packages/ble
  ccid:
    path: vendor/NekokoLPA2/local_packages/ccid
  nlpa2:
    path: vendor/NekokoLPA2
  roam_lpa_core:
    path: packages/roam_lpa_core
  local_auth: ^3.0.2
  firebase_crashlytics: ^5.2.7
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/europe.png
    - assets/branding/
    - assets/onboarding/
  config:
    enable-swift-package-manager: false
